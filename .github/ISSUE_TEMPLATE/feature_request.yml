name: Feature Request
description: Suggest an idea or enhancement for Veriflux
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thank you for suggesting an improvement to Veriflux!
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a specific problem or pain point?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches or libraries?
