[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "veriflux"
dynamic = ["version"]
description = "The definitive AI/ML testing, evaluation, guardrail, and reliability library. Built from scratch."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Veriflux Contributors" },
]
keywords = [
    "ai", "ml", "llm", "testing", "evaluation", "guardrails",
    "hallucination", "pytest", "ci-cd", "reliability",
    "context-engineering", "agent-tracing", "structured-output",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Framework :: Pytest",
    "Typing :: Typed",
]

# === ZERO RUNTIME DEPENDENCIES (core runs on stdlib) ===
dependencies = []

[project.optional-dependencies]
# Performance accelerators
perf = ["numpy>=1.24.0"]

# HTTP provider clients
providers = ["httpx>=0.27.0"]

# Beautiful CLI output
cli = ["click>=8.1.0", "rich>=13.0.0"]

# Full installation (recommended)
full = [
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

# Development
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

# Documentation
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/veriflux/veriflux"
Documentation = "https://veriflux.dev"
Repository = "https://github.com/veriflux/veriflux"
Changelog = "https://github.com/veriflux/veriflux/blob/main/CHANGELOG.md"
Issues = "https://github.com/veriflux/veriflux/issues"

# === PYTEST PLUGIN ENTRY POINT ===
[project.entry-points.pytest11]
veriflux = "veriflux.pytest_plugin.plugin"

# === CLI ENTRY POINT ===
[project.scripts]
veriflux = "veriflux.cli.main:cli_entry"

# === BUILD CONFIGURATION ===
[tool.hatch.version]
path = "src/veriflux/__version__.py"

[tool.hatch.build.targets.sdist]
include = ["/src/veriflux"]

[tool.hatch.build.targets.wheel]
packages = ["src/veriflux"]

# === TOOL CONFIGURATIONS ===
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "RUF",  # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["veriflux"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
    "benchmark: marks performance benchmark tests",
]

[tool.coverage.run]
source = ["veriflux"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
